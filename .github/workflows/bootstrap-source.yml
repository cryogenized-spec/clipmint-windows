name: Bootstrap Windows source (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  expand-reviewed-source:
    if: github.repository == 'cryogenized-spec/clipmint-windows'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract committed source archive
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          from pathlib import Path

          archive = ''.join(
              (Path('bootstrap') / f'source_{i:02d}.b64').read_text(encoding='ascii')
              for i in range(6)
          )
          data = lzma.decompress(base64.b64decode(archive, validate=True))
          expected = '709d1575a09c003837b401c83414d3974de18bd94b0a824b65d4110220f8d7fa'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Source integrity mismatch: refusing import')
          entries = json.loads(data)['files']
          if len(entries) != 19:
              raise SystemExit('Unexpected source file count')
          seen = set()
          for entry in entries:
              relative = Path(entry['path'])
              if (relative.is_absolute() or '..' in relative.parts
                      or relative.as_posix() in seen
                      or relative.as_posix().startswith('bootstrap/')
                      or relative.as_posix() in {'LICENSE', 'README.md', 'assets/ClipMint.png'}):
                  raise SystemExit('Disallowed source path')
              seen.add(relative.as_posix())
              target = Path.cwd() / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(entry['content'], encoding='utf-8')
              print('Imported:', relative.as_posix())

          for chunk in Path('bootstrap').glob('source_*.b64'):
              chunk.unlink()
          Path('bootstrap').rmdir()
          Path('.github/workflows/bootstrap-source.yml').unlink()
          print('Source import verified and temporary bootstrap removed')
          PY
      - name: Commit normal source files to this Windows repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import standalone Windows x64 Qt alpha sources'
          git push origin HEAD:main
